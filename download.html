<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>媒体下载</title>
  <link rel="stylesheet" href="download.css" />
</head>
<body>
  <main>
    <h1 id="title">媒体下载</h1>
    <p id="status">正在准备文件…</p>
    <p id="fileName" class="file-name"></p>
    <div class="actions">
      <button id="save" type="button" disabled>保存文件</button>
      <button id="share" type="button" class="secondary" hidden>系统分享</button>
      <button id="open" type="button" class="secondary" disabled>打开文件</button>
    </div>
  </main>
  <script src="download.js"></script>
</body>
</html>
